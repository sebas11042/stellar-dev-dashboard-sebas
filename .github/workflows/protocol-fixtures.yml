name: Protocol fixture provenance

on:
  pull_request:
    branches: [master, main, develop]
  push:
    branches: [master, main, develop]
  schedule:
    - cron: '30 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protocol-fixtures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Protocol fixture integrity (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run fixtures:protocol:check
      - run: pnpm run test:protocol-fixtures
      - run: pnpm exec vitest run tests/unit/protocolFixtureCorpus.test.ts tests/unit/sorobanContractFixtures.test.ts
      - name: Type check corpus integration
        run: >-
          pnpm exec tsc --noEmit --skipLibCheck --target ES2022 --module ESNext
          --moduleResolution bundler --resolveJsonModule --esModuleInterop
          --types node --typeRoots packages/core/node_modules/@types
          tests/unit/protocolFixtureCorpus.test.ts
      - name: Verify fixture tooling formatting
        run: pnpm exec prettier --check scripts/protocol-fixtures.mjs scripts/refresh-protocol-fixtures.mjs tests/ci/protocol-fixture-*.test.mjs tests/unit/protocolFixtureCorpus.test.ts tests/__factories__/protocol-fixture-spec.json .github/workflows/protocol-fixtures.yml

  refresh:
    name: Prepare reviewed refresh artifact
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run fixtures:protocol:refresh
      - run: pnpm run fixtures:protocol:check
      - run: pnpm run test:protocol-fixtures
      - run: pnpm exec vitest run tests/unit/protocolFixtureCorpus.test.ts
      - uses: actions/upload-artifact@v7
        with:
          name: protocol-fixture-refresh
          path: tests/__factories__/protocol-fixtures.generated.json
          if-no-files-found: error
          retention-days: 14
